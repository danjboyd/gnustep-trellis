# Trellis CI. Public repo, so the Linux job runs free on pushes to main and PRs.
#
# Linux job (packages per docs/building.md): the GNUstep toolchain (clang + libobjc2 + libdispatch + GNUstep
# make/base/gui/back, built by scripts/install-toolchain-debian.sh) is cached,
# so only a cache miss pays the ~20 min source build.
# macOS job: manual dispatch only (macos=true); the macOS check is otherwise
# run on a project Mac.
name: CI

# Docs-only changes skip CI, except the tutorial, which the tutorial step
# follows literally (later patterns win).
on:
  push:
    branches: [main]
    paths: ['**', '!docs/**', '!**.md', 'docs/tutorial.md']
  pull_request:
    paths: ['**', '!docs/**', '!**.md', 'docs/tutorial.md']
  workflow_dispatch:
    inputs:
      macos:
        description: 'Also run the macOS job (bills at 10x)'
        type: boolean
        default: false

# Superseded PR runs are cancelled; runs on main always finish, so main is
# tested at every push and a cache-miss toolchain build gets to save its cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TRELLIS_TOOLCHAIN: /home/runner/opt/trellis-toolchain
      TRELLIS_GNUSTEP_HOME: /home/runner/.cache/trellis-gnustep-home
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build pkg-config git python3 xvfb \
            libffi-dev libxml2-dev libxslt1-dev libgnutls28-dev libicu-dev \
            libcurl4-gnutls-dev zlib1g-dev libavahi-client-dev libbsd-dev libgmp-dev \
            libcairo2-dev libxt-dev libxft-dev libfreetype-dev libfontconfig-dev \
            libjpeg-dev libtiff-dev libpng-dev libgif-dev libxrandr-dev libxext-dev

      - name: Restore toolchain
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/opt/trellis-toolchain
          # Bump the suffix to force a rebuild against newer upstream heads.
          key: toolchain-ubuntu-24.04-${{ hashFiles('scripts/install-toolchain-debian.sh') }}-v1

      - name: Build toolchain (cache miss only)
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: PREFIX=$TRELLIS_TOOLCHAIN SRC=$RUNNER_TEMP/gnustep-src J=4 scripts/install-toolchain-debian.sh

      # Saved right after the build, so a later failing test can't discard it.
      - name: Save toolchain (cache miss only)
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/opt/trellis-toolchain
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      # Tests/View/appearance.sh renders with --theme Adwaita.
      - name: Adwaita GSTheme (pinned)
        run: |
          set +u; . scripts/env.sh; set -u
          git clone -q https://github.com/danjboyd/plugins-themes-Adwaita "$RUNNER_TEMP/adwaita"
          git -C "$RUNNER_TEMP/adwaita" checkout -q 9c25a6823c3d0af715b197e64e8ca2d9bee9b456
          make -C "$RUNNER_TEMP/adwaita" -j4
          make -C "$RUNNER_TEMP/adwaita" install GNUSTEP_INSTALLATION_DOMAIN=LOCAL

      - name: Build Trellis
        run: |
          set +u; . scripts/env.sh; set -u
          make -j4

      - name: make check (engine cases, lint, markup; conformance report)
        run: |
          set +u; . scripts/env.sh; set -u
          make check

      - name: Conformance gate (no suite below the recorded Linux results)
        run: |
          set +u; . scripts/env.sh; set -u
          LD_LIBRARY_PATH=./obj:$LD_LIBRARY_PATH \
            python3 -I scripts/conformance-summary.py check --platform linux --runner ./obj/trellis-case

      - name: Importer unit tests
        run: |
          python3 -I Tests/Conformance/tools/test_import_wpt.py
          python3 -I Tests/Conformance/tools/test_snapshot_diff.py

      - name: Frame replay of the golden dumps, with self-test
        run: |
          set +u; . scripts/env.sh; set -u
          make check-reference

      - name: View checks, headless (Xvfb)
        run: |
          set +u; . scripts/env.sh; set -u
          # Exits non-zero if any view check fails (HOOK, OPENFILE, APPEARANCE, SCROLLQUERY).
          make check-gui

      # Last: it installs Trellis into the (already saved) toolchain.
      - name: Tutorial (docs/tutorial.md, followed literally)
        run: |
          set +u; . scripts/env.sh; set -u
          scripts/check-tutorial.sh "$RUNNER_TEMP/tutorial"

  macos:
    # Disabled until the maintainer approves macOS runner minutes (10x). Runs only on a
    # manual dispatch with macos=true.
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and check (Apple clang, no GNUstep)
        run: make -j3 -f Makefile.macos gui check
      - name: Conformance gate (no suite below the recorded macOS results)
        run: python3 -I scripts/conformance-summary.py check --platform macos --runner build/trellis-case
      - name: Importer unit tests
        run: make -f Makefile.macos check-importers
      - name: View tests under NSZombieEnabled (window-free)
        run: make -f Makefile.macos check-view
      - name: Frame replay of the golden dumps, with self-test
        run: make -f Makefile.macos check-reference
      - name: Window-free render smoke test
        run: |
          for s in Dashboard Settings AskDetail; do
            build/trellis-render Examples/TrellisDemo/$s.trellis --appearance dark --widths 340,900 --lint
          done
