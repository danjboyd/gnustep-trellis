name: scratch-windows-qualification

# One-off qualification run (ask to Dan pending): TrellisPreview's MSI and the
# Windows parity matrix, both on gnustep-cli v0.1.9's patched toolchain, at
# draft/windows-preview 6f29952, with WinUITheme (Adwaita is Linux-only). Started by the single push to this branch;
# workflow_dispatch can't reach a file that isn't on the default branch.
on:
  push:
    branches:
      - packaging/scratch-windows

env:
  CLI_BASE: https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.9
  CLI_PS1_SHA256: 4d39c0e45c618dd38dad533bdc6decd9a4b4cbd92b913084b1d75043298e7bf7
  WINUITHEME_REF: 72f2a10743e5a441a2d4b4e36e03ce150da3caab

jobs:
  msi:
    uses: danjboyd/gnustep-packager/.github/workflows/package-gnustep-app.yml@fe367b3493a589bf635dc83bb0e32b6a0c6a5b36
    with:
      manifest-path: packaging/package.manifest.json
      backend: msi
      packager-ref: fe367b3493a589bf635dc83bb0e32b6a0c6a5b36
      toolchain-variant: patched
      gnustep-cli-manifest-url: https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.9/release-manifest.json
      gnustep-cli-bootstrap-url: https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.9/gnustep-bootstrap.sh
      gnustep-cli-bootstrap-sha256: 3fca82d1b20f58af3bd97ef84c7991e8d0061be80eddc613d3b3b47c6e6a6895
      gnustep-cli-bootstrap-ps1-sha256: 4d39c0e45c618dd38dad533bdc6decd9a4b4cbd92b913084b1d75043298e7bf7
      run-validation: true
      run-smoke: true
      artifact-name: trellis-preview-msi
      artifact-retention-days: 7

  # gnustep-cssbox's parity matrix (Tests/Parity/run.sh), independent of the
  # MSI job so a packaging failure doesn't hide its data.
  parity:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # run.sh's pixel check and manifest need python3 (or python).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: gnustep-cli v0.1.9, patched variant
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "gnustep-cli"
          $bootstrap = Join-Path $env:RUNNER_TEMP "gnustep-bootstrap.ps1"
          Invoke-WebRequest -Uri "$env:CLI_BASE/gnustep-bootstrap.ps1" -OutFile $bootstrap
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $bootstrap).Hash.ToLowerInvariant()
          if ($sha -ne $env:CLI_PS1_SHA256) { throw "gnustep-bootstrap.ps1 sha256 $sha, expected $env:CLI_PS1_SHA256" }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $bootstrap --json --yes setup --user --root $root --manifest "$env:CLI_BASE/release-manifest.json" --variant patched
          if ($LASTEXITCODE -ne 0) { throw "gnustep-cli setup failed ($LASTEXITCODE)" }
          $state = Get-Content -Raw (Join-Path $root "state\cli-state.json") | ConvertFrom-Json
          if ($state.toolchain_variant -ne "patched") { throw "toolchain_variant is '$($state.toolchain_variant)', not patched" }
          Write-Host "Toolchain variant: patched ($(@($state.carry_layer.patches).Count) patches)"
          "GNUSTEP_CLI_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build WinUITheme, Trellis; make check; parity matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:GNUSTEP_CLI_ROOT
          $gnustepSh = Get-ChildItem -Path (Join-Path $root "clang64") -Recurse -File -Filter "GNUstep.sh" | Select-Object -First 1
          $parity = Join-Path $env:RUNNER_TEMP "parity"
          # The runner's git: the toolchain's minimal MSYS2 PATH may not have one.
          $theme = Join-Path $env:RUNNER_TEMP "winuitheme"
          git clone -q https://github.com/danjboyd/plugins-themes-winuitheme $theme
          git -C $theme checkout -q $env:WINUITHEME_REF
          if ($LASTEXITCODE -ne 0) { throw "WinUITheme checkout failed" }
          $env:MSYSTEM = "CLANG64"
          $env:CHERE_INVOKING = "1"
          $script = @"
          set -e
          cd "`$(cygpath -u '$env:GITHUB_WORKSPACE')"
          set +u; . "`$(cygpath -u '$($gnustepSh.FullName)')"; set -u
          export PATH="`$PATH:`$(cygpath -u '$env:pythonLocation')"
          command -v python3 || command -v python
          make -C "`$(cygpath -u '$env:RUNNER_TEMP')/winuitheme" -j4 messages=yes
          make -C "`$(cygpath -u '$env:RUNNER_TEMP')/winuitheme" install GNUSTEP_INSTALLATION_DOMAIN=LOCAL
          make -j4 hot_reload=no
          . scripts/env.sh
          # make check is recorded but non-fatal (agreed with gnustep-cssbox); the matrix decides.
          mkdir -p "`$(cygpath -u '$env:RUNNER_TEMP')/parity-logs"
          check_rc=0; make check > "`$(cygpath -u '$env:RUNNER_TEMP')/parity-logs/make-check.log" 2>&1 || check_rc=`$?
          echo "make check exit `$check_rc"
          export TRELLIS_TEST_USER="`$USERNAME"
          parity_rc=0; THEMES="WinUITheme:light,dark GNUstep" bash Tests/Parity/run.sh "`$(cygpath -u '$parity')" || parity_rc=`$?
          echo "parity exit `$parity_rc"
          exit "`$parity_rc"
          "@
          & (Join-Path $root "usr\bin\bash.exe") -lc $script
          if ($LASTEXITCODE -ne 0) { throw "parity step failed ($LASTEXITCODE)" }

      - name: Upload parity folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trellis-windows-parity
          path: |
            ${{ runner.temp }}/parity
            ${{ runner.temp }}/parity-logs
          retention-days: 7
          if-no-files-found: warn
